name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.1.2
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Loop enforcement tests
        run: pnpm test:loop

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Convex tests
        run: pnpm test:convex

      - name: Worker tests
        run: pnpm test:worker

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    concurrency:
      group: shared-preview-backend
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.1.2
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview E2E configuration
        env:
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          E2E_AUTH0_EMAIL: ${{ secrets.E2E_AUTH0_EMAIL }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
        run: |
          test -n "$VITE_AUTH0_CLIENT_ID"
          test -n "$VITE_AUTH0_DOMAIN"
          test -n "$VITE_CONVEX_URL"
          test -n "$E2E_AUTH0_EMAIL"
          test -n "$E2E_AUTH0_PASSWORD"

      - name: Deploy Convex Preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          test -n "$CONVEX_DEPLOY_KEY"
          pnpm exec convex deploy --message "CI E2E ${{ github.sha }}"

      - name: Smoke test Convex Preview
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          pnpm exec convex run health:get | grep -q '"ok": true'

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        env:
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          E2E_AUTH0_EMAIL: ${{ secrets.E2E_AUTH0_EMAIL }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
          E2E_AUTH0_CONNECTION: Username-Password-Authentication
        run: pnpm test:e2e
