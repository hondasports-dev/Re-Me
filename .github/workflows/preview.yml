name: Preview deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-preview-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shared Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: preview
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_API_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.1.2
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PREVIEW_BASE_URL"
          test -n "$VITE_AUTH0_CLIENT_ID"
          test -n "$VITE_AUTH0_DOMAIN"
          test -n "$VITE_API_BASE_URL"

      - name: Build Preview frontend
        run: pnpm build:preview

      - name: Validate Preview Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          secret_names="$(pnpm exec wrangler secret list --env preview)"
          for secret_name in CAPABILITY_SECRET VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            printf '%s' "$secret_names" | grep -q "$secret_name" || {
              echo "missing Preview Worker secret: $secret_name"
              exit 1
            }
          done

      - name: Deploy Cloudflare Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm deploy:preview

      - name: Smoke test Cloudflare Preview
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$PREVIEW_BASE_URL/api/health" | grep -q '"status":"ok"' && \
              curl --connect-timeout 5 --max-time 10 --fail --silent --show-error "$PREVIEW_BASE_URL/compose" | grep -q '<div id="app"></div>'; then
              echo "Preview smoke passed on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt 6 ]; then
              echo "Preview smoke is not ready (attempt $attempt/6); retrying in 5 seconds"
              sleep 5
            fi
          done

          echo "Preview smoke failed after 6 attempts"
          exit 1
