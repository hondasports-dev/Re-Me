name: Preview deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-preview-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy shared Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: preview
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.1.2
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Preview configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PREVIEW_BASE_URL"
          test -n "$VITE_AUTH0_CLIENT_ID"
          test -n "$VITE_AUTH0_DOMAIN"
          test -n "$VITE_CONVEX_URL"

      - name: Build Preview frontend
        run: pnpm build:preview

      - name: Deploy Convex Preview
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          test -n "$CONVEX_DEPLOY_KEY"
          pnpm exec convex deploy --message "GitHub Preview run ${{ github.run_id }}"

      - name: Smoke test Convex Preview
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          pnpm exec convex run health:get | grep -q '"ok": true'

      - name: Deploy Cloudflare Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          pnpm exec wrangler deploy --env preview

      - name: Smoke test Cloudflare Preview
        shell: bash
        run: |
          curl --fail --silent --show-error "$PREVIEW_BASE_URL/api/health" | grep -q '"status":"ok"'
          curl --fail --silent --show-error "$PREVIEW_BASE_URL/compose" | grep -q '<div id="app"></div>'
