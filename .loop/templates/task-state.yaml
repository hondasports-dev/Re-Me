# Every review / verification finding is stable-id'd before reconciliation.
review_finding_record_schema:
  id: ""
  finding: ""
  failure_scenario: ""
  affected_invariants: []
  affected_acceptance_criteria: []
  risk_domains: [] # process.risk_reconciliation_policy.risk_domain_enum
  classification_required: ""
  test_gap: ""
  test_gap_id: ""
  source: ""
  evidence: []
  recommended_disposition: ""

source_fidelity_record_schema:
  source_finding_id: ""
  test_gap: "" # exact copy of the source finding; empty only when source is empty
  test_gap_id: "" # exact copy of the source finding id for the gap
  risk_domains: [] # must contain every protected source domain
  failure_scenario: "" # equal to or an explicit superset of the source
  affected_invariants: [] # equal to or an explicit superset of the source
  affected_acceptance_criteria: [] # equal to or an explicit superset of the source
  residual_failure_scenario: "" # recorded target when relation is explicit_superset
  residual_affected_invariants: []
  residual_affected_acceptance_criteria: []
  relation: equal_or_explicit_superset
  evidence: []

# Every residual-risk record is reconciled by root; reviewer labels are only recommendations.
residual_risk_record_schema:
  id: ""
  finding: ""
  failure_scenario: ""
  affected_invariants: []
  affected_acceptance_criteria: []
  risk_domains: [] # process.risk_reconciliation_policy.risk_domain_enum; other requires rationale
  classification_required: "" # required when risk_domains includes other
  test_gap: ""
  test_gap_id: ""
  source_finding_ids: []
  source_fidelity: [] # source_fidelity_record_schema; every source link is covered
  source: ""
  evidence: []
  recommended_disposition: "" # reviewer recommendation; root owns final disposition
  disposition: pending # pending | fix_now | defer_with_evidence | accept_with_human_gate | not_applicable
  rationale: ""
  mitigation: ""
  safe_failure_or_unreachable: ""
  follow_up_issue: ""
  not_applicable_proof: ""
  current_head_evidence: []
  human_approval:
    required: false
    status: not_required # pending | approved | rejected | not_required
    approver: ""
    approved_at: ""
    scope: ""
    evidence: ""

material_test_gap_record_schema:
  id: "" # stable identifier; every item must map to residual_risk_record_schema.test_gap_id
  test_gap: "" # exact source finding test_gap text
  test_gap_id: "" # must equal id and the source finding test_gap_id
  finding: ""
  failure_scenario: ""
  affected_invariants: []
  affected_acceptance_criteria: []
  evidence: []

