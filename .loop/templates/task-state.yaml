  specification:
    confidence: c1_reconstructed # c0_unclear | c0_conflicted | c1_reconstructed | c2_confirmed
    authoritative_sources:
      - "user instruction in current task: Issue #60をループで対応し、データ移行を含める"
      - "https://github.com/hondasports/Re-Me/issues/60"
      - "convex/schema.ts and existing Convex validators/functions"
      - "docs/architecture/overview.md and docs/architecture/data-model.md"
      - "docs/development/legacy-migration.md for existing production-data Human Gate boundary"
    conflicting_sources: []
    material_assumptions:
      - "Production Cloudflare D1/R2 resources and a production Convex export are not present in this worktree; migration code must be runnable in dry-run/local mode and must not infer or mutate production state."
      - "D1 keeps stable text IDs from Convex documents so foreign-key remapping is deterministic; migration_import_keys remains the audit/idempotency map."
      - "Convex export input is JSON object/array or JSON Lines per table containing _id and _creationTime, as documented by the Convex CLI export/data formats."
    unresolved_material_choices: []
  goal: "D1をCloudflare Workerのapplication-data targetとして定義し、Convex exportを検証付き・再実行可能なD1 SQLへ変換できる状態を作る。"
  in_scope:
    - "D1 schema migration for all Issue #60 application tables, constraints, indexes, private schedule fields, and migration_import_keys"
    - "local/preview/production Cloudflare binding separation for D1, private R2, notification Queue, and delivery Cron"
    - "Convex export inventory, normalization, relationship/visibility validation, deterministic import order, checksum/idempotency map, and rollback manifest generation"
    - "unit and Worker D1 schema tests plus migration runbook/architecture documentation"
  out_of_scope:
    - "Production D1/R2/Queue resource creation, production export, production import, traffic cutover, or deletion"
    - "Convex runtime/API/frontend cutover and final Convex dependency cleanup; these require later vertical slices after this foundation"
    - "Production R2 object copy; the migration manifest records the required object keys and Human Gate boundary"
  acceptance_criteria:
    - { id: AC01, expectation: "D1 migration defines users, user_settings, threads, letters, letter_contents, letter_attachments, attachment_finalization_attempts, letter_deliveries, notification_jobs, and push_subscriptions with ownership/FK/uniqueness/state constraints and required indexes." }
    - { id: AC02, expectation: "Wrangler configuration separates local, Preview, and Production Worker names and backend bindings without committing resource IDs or secrets, and registers bounded delivery Cron/notification Queue bindings." }
    - { id: AC03, expectation: "The migration tool accepts Convex JSON/JSONL table exports, preserves stable IDs/timestamps/relationships/private scheduledAt, derives the single next-letter link, and rejects malformed, orphaned, branching, or inconsistent data before SQL generation." }
    - { id: AC04, expectation: "The migration tool emits deterministic import ordering, migration_import_keys checksum records, idempotent SQL, and a rollback manifest; default execution is dry-run and production writes require an explicit Human Gate flag." }
    - { id: AC05, expectation: "Migration output keeps sealed-content and exact-schedule data in private target columns and does not create a browser/public payload containing body or scheduledAt." }
    - { id: AC06, expectation: "Automated tests prove schema/mapping happy paths, boundary/denial/failure cases, checksum drift, branch rejection, sealed visibility, exact-schedule privacy, idempotency, and rollback coverage." }
    - { id: AC07, expectation: "Architecture/setup/data-migration docs describe the target mapping, environment separation, dry-run/rehearsal, rollback, and Production Human Gate." }
  invariants:
    - { id: IV01, preserve: "Production data mutation/export/import, R2 copy, resource deletion, and secret changes remain blocked unless explicitly approved by a Human Gate." }
    - { id: IV02, preserve: "Owner identity is resolved from the exported users table and client-supplied ownership is never treated as authoritative by migration planning." }
    - { id: IV03, preserve: "Sealed traveling or delivered-unopened content remains unreadable by the public projection, and exact scheduledAt remains absent from public metadata." }
    - { id: IV04, preserve: "Sent-letter immutable fields and single-path reply relationships are rejected when an export cannot represent them safely." }
    - { id: IV05, preserve: "Secrets, production dumps, identity maps, and R2 inventories stay outside tracked repository files." }
  relevance_dimensions:
    happy_path: relevant # relevant | not_applicable
    boundary: relevant
    error_failure: relevant
    empty_loading: not_applicable
    auth_ownership: relevant
    persistence_state_transition: relevant
    caller_compatibility: relevant
    concurrency_idempotency: relevant
    navigation_accessibility: not_applicable
    not_applicable_reasons:
      empty_loading: "このfoundation差分はUI画面を変更せず、export parser/D1 schemaを対象にする。"
      navigation_accessibility: "user-visible route/operationを変更しない。"
